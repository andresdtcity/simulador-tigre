<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Tigre</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#007bff">
</head>

<body>

<h1>🚗 Simulador Examen Tigre</h1>

<div id="info">
  <span id="contador"></span>
  <span id="timer"></span>
</div>

<div id="inicio">

  <h2>Bienvenido</h2>

  <p>
    Simulador del examen teórico de Tigre.
  </p>

  <div id="menuModos">

    <button id="btnInicio" onclick="comenzarExamen()" disabled>
      📍 Examen de direcciones
      <span class="sub">30 preguntas sobre ubicaciones</span>
    </button>

    <button id="btnInicioSenales" onclick="iniciarExamenSenales()">
      🛑 Examen de señales
      <span class="sub">20 preguntas sobre señalización vial</span>
    </button>

  </div>

</div>

<div id="contenedor">
  <h3 id="numeroPregunta"></h3>
  <div id="pregunta"></div>
  <div id="opciones"></div>
  <div id="mapa"></div>

  <button id="siguiente" onclick="siguiente()">
    Siguiente
  </button>
</div>

<div id="contenedorSenales">
  <h3 id="numeroPreguntaSenal"></h3>
  <div id="imagenSenal"></div>
  <div id="preguntaSenal"></div>
  <div id="opcionesSenal"></div>

  <button id="siguienteSenal" onclick="siguienteSenal()">
    Siguiente
  </button>
</div>

<script src="senales-data.js"></script>
<script src="senales-iconos.js"></script>
<script src="senales-examen.js"></script>
<script src="script.js"></script>

</body>
</html>
