<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Tigre</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<h1>🚗 Simulador Examen Tigre</h1>

<div id="info">
  <span id="contador"></span>
  <span id="timer"></span>
</div>
<div id="inicio">

  <h2>Bienvenido</h2>

  <p>
    Simulador del examen teórico de Tigre.
  </p>

  <p>
    Tendrás 30 preguntas aleatorias.
  </p>

  <button onclick="comenzarExamen()">
    Comenzar examen
  </button>

</div>
  
<div id="contenedor">
  <h3 id="numeroPregunta"></h3>
  <div id="pregunta"></div>
  <div id="opciones"></div>

  <button id="siguiente" onclick="siguiente()">
    Siguiente
  </button>
</div>

<div id="resultado"></div>
<button onclick="practicarErrores()">
    Practicar errores
</button>

<script src="script.js"></script>

</body>
</html>
